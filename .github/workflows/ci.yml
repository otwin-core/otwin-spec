name: CI

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Unit tests, including the mutants that prove the suite has teeth
        run: pytest --cov --cov-report=term-missing

  conformance:
    name: reference implementation is conformant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - run: otwin-conformance python --report conformance.json --badge badge.json -v
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: conformance, path: "*.json"}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
