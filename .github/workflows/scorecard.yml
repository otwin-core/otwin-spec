name: Scorecard

# OpenSSF Scorecard, rebuilt from scratch on 2026-08-03.
#
# The previous workflow was inherited from the pre-rename repository. Its
# results were published under github.com/Javihaus/otwin, and Scorecard keys
# results by repository path without following GitHub's rename redirect -- so
# after otwin -> otwin-hybrid the badge asked for a path the API had never
# heard of and rendered "invalid repo path". Nothing was wrong with the score
# (7.1 on 2026-08-01); the address was simply stale.
#
# This version publishes under the current path and pins every action to a
# full commit SHA. A tag is mutable: whoever controls the action's repository
# can repoint it, and every workflow trusting that tag then runs the new code
# against your token. That is what Scorecard's own Pinned-Dependencies check
# is measuring, so an unpinned Scorecard workflow marks itself down.

on:
  # Lets you force a refresh instead of waiting for the Tuesday cron. The badge
  # reads the last published result, so after a rename or a settings change you
  # want to republish immediately rather than in six days.
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: '31 5 * * 2'
  push:
    branches: [main]

# Read-only by default; the analysis job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF to the Security tab.
      security-events: write
      # Publish to the public API. Without this the badge never resolves,
      # however many times the workflow succeeds.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard reads the repository; it must never hold a writable token.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: results.sarif
